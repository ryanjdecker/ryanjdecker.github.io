<h1>Inclusive <i>or</i></h1>
<p>Pronounced OR, YOR, or EE-OR.</p>
<p>
    For sentences P and Q, P <dfn>ior</dfn> Q if and only if P is true, Q is true, or both are true.
</p>
<p>
    I use <i>ior</i> when I want to be clear that the options are not exclusive.
    Compare <i>xor</i>.
</p>
